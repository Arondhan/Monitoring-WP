version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: uptime_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uptime_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uptime_pass}
      POSTGRES_DB: ${POSTGRES_DB:-uptime_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uptime_user -d uptime_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Broker for Celery
  redis:
    image: redis:7-alpine
    container_name: uptime_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uptime_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-uptime_user}:${POSTGRES_PASSWORD:-uptime_pass}@postgres:5432/${POSTGRES_DB:-uptime_db}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-key-min-32-characters}
      SSL_WARNING_DAYS: ${SSL_WARNING_DAYS:-14}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-10}
      SLOW_THRESHOLD_MS: ${SLOW_THRESHOLD_MS:-1500}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # Celery Worker
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uptime_celery_worker
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-uptime_user}:${POSTGRES_PASSWORD:-uptime_pass}@postgres:5432/${POSTGRES_DB:-uptime_db}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-key-min-32-characters}
      SSL_WARNING_DAYS: ${SSL_WARNING_DAYS:-14}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-10}
      SLOW_THRESHOLD_MS: ${SLOW_THRESHOLD_MS:-1500}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.celery worker --loglevel=info --concurrency=4

  # Celery Beat (Scheduler)
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uptime_celery_beat
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-uptime_user}:${POSTGRES_PASSWORD:-uptime_pass}@postgres:5432/${POSTGRES_DB:-uptime_db}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-key-min-32-characters}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.celery beat --loglevel=info

  # Flower - Celery Monitoring (optional)
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uptime_flower
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - redis
    command: celery -A app.celery flower --port=5555

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uptime_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      VITE_API_URL: /api

volumes:
  postgres_data:
